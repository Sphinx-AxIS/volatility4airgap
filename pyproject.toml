[project]
name = "volatility4airgap"
version = "0.5.0b1"
description = "Portable Volatility3 triage for air-gapped Windows workstations"
requires-python = ">=3.9"
# The tool itself uses only the standard library. volatility3 is supplied by the
# bundle's lib/ directory, not installed here.
dependencies = []

[project.optional-dependencies]
# volatility3 is a *test* dependency only, for tests/test_differential_volatility.py,
# which checks our symbol-server derivations still agree with upstream. The shipped
# tool gets volatility3 from the bundle's lib/ directory instead.
dev = ["pytest>=8.0", "volatility3>=2.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Network tests are opt-in: the suite must pass on a machine with no connectivity.
# Run the real Microsoft symbol-server round trip with: pytest -m network
addopts = "-q -m 'not network'"
markers = ["network: reaches the internet; deselected by default"]

[tool.ruff]
line-length = 100
target-version = "py39"
